<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis — Asistente Neural de Voz</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #05050f;
      --panel:     rgba(10, 12, 30, 0.85);
      --border:    rgba(0, 180, 255, 0.18);
      --accent:    #00b4ff;
      --accent2:   #7c3aed;
      --user-bg:   rgba(124, 58, 237, 0.12);
      --user-bdr:  rgba(124, 58, 237, 0.4);
      --jarvis-bg: rgba(0, 180, 255, 0.07);
      --jarvis-bdr:rgba(0, 180, 255, 0.35);
      --text:      #d4e4ff;
      --muted:     rgba(180, 200, 255, 0.45);
      --glow:      0 0 30px rgba(0, 180, 255, 0.15);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
    }

    /* ── Fondo animado ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%,   rgba(0,100,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(120,0,255,0.06) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── Grid lines decorativas ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    /* ── Layout principal ── */
    #app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo-ring {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(0,180,255,0.3), inset 0 0 12px rgba(0,180,255,0.1);
      flex-shrink: 0;
      animation: ring-pulse 3s ease-in-out infinite;
    }
    .logo-ring span {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900; font-size: 18px;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent);
    }
    @keyframes ring-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0,180,255,0.3), inset 0 0 12px rgba(0,180,255,0.1); }
      50%       { box-shadow: 0 0 35px rgba(0,180,255,0.5), inset 0 0 20px rgba(0,180,255,0.2); }
    }

    .header-info { flex: 1; }
    .header-info h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px; font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #00b4ff, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-info p {
      font-size: 12px; color: var(--muted);
      letter-spacing: 2px; text-transform: uppercase; margin-top: 2px;
    }

    #status-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: 'Fira Code', monospace;
      font-size: 11px; letter-spacing: 1px;
      color: var(--muted);
      background: var(--panel);
      transition: all 0.4s;
      white-space: nowrap;
    }
    #status-badge.speaking {
      border-color: rgba(0,180,255,0.6);
      color: var(--accent);
      box-shadow: 0 0 14px rgba(0,180,255,0.2);
    }
    #status-badge.processing {
      border-color: rgba(124,58,237,0.6);
      color: #a78bfa;
      box-shadow: 0 0 14px rgba(124,58,237,0.2);
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      transition: all 0.4s;
    }
    #status-badge.speaking   #status-dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 0.8s infinite; }
    #status-badge.processing #status-dot { background: #a78bfa;       box-shadow: 0 0 8px #a78bfa;       animation: blink 0.6s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── Onda de voz ── */
    #wave-container {
      display: flex; align-items: center; justify-content: center; gap: 3px;
      height: 28px; margin-left: 8px;
    }
    .wave-bar {
      width: 3px; border-radius: 2px;
      background: var(--accent);
      opacity: 0.15;
      transition: opacity 0.3s;
    }
    #status-badge.speaking .wave-bar {
      opacity: 1;
      animation: wave-anim 0.8s ease-in-out infinite;
    }
    .wave-bar:nth-child(1) { animation-delay: 0.0s; height: 8px; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 14px; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 20px; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 14px; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 8px; }
    @keyframes wave-anim {
      0%,100% { transform: scaleY(0.4); }
      50%      { transform: scaleY(1.0); }
    }

    /* ── Chat ── */
    #chat {
      overflow-y: auto;
      padding: 20px 0;
      display: flex; flex-direction: column; gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex; gap: 12px; max-width: 82%;
      animation: msg-in 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.jarvis { align-self: flex-start; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 700;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg.jarvis .msg-avatar {
      background: rgba(0,180,255,0.1);
      border: 1px solid rgba(0,180,255,0.4);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0,180,255,0.2);
    }
    .msg.user .msg-avatar {
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.4);
      color: #a78bfa;
      box-shadow: 0 0 12px rgba(124,58,237,0.15);
    }

    .msg-body { display: flex; flex-direction: column; gap: 4px; }

    .msg-sender {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      padding: 0 4px;
    }
    .msg.jarvis .msg-sender { color: rgba(0,180,255,0.7); }
    .msg.user   .msg-sender { color: rgba(124,58,237,0.7); text-align: right; }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 15px; line-height: 1.6;
      border: 1px solid;
    }
    .msg.jarvis .msg-bubble {
      background: var(--jarvis-bg);
      border-color: var(--jarvis-bdr);
      border-top-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: var(--user-bg);
      border-color: var(--user-bdr);
      border-top-right-radius: 4px;
      text-align: right;
    }

    /* Typing indicator */
    .typing-dots { display: flex; gap: 5px; padding: 4px 0; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); opacity: 0.4;
      animation: dot-bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-bounce {
      0%,80%,100% { transform: translateY(0); opacity:0.4; }
      40%          { transform: translateY(-6px); opacity:1; }
    }

    /* ── Input area ── */
    #input-area {
      padding: 16px 0 20px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 12px;
    }

    #input-row {
      display: flex; gap: 10px; align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: rgba(10,15,40,0.7);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      resize: none; min-height: 48px; max-height: 120px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      scrollbar-width: none;
    }
    #user-input:focus {
      border-color: rgba(0,180,255,0.5);
      box-shadow: 0 0 0 3px rgba(0,180,255,0.08);
    }
    #user-input::placeholder { color: var(--muted); }

    .btn {
      height: 48px; width: 48px;
      border-radius: 14px; border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: all 0.25s;
      flex-shrink: 0;
    }
    .btn:hover { border-color: rgba(0,180,255,0.5); color: var(--accent); box-shadow: 0 0 14px rgba(0,180,255,0.15); }
    .btn:active { transform: scale(0.93); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #btn-send {
      width: 56px;
      background: linear-gradient(135deg, rgba(0,100,200,0.3), rgba(0,180,255,0.2));
      border-color: rgba(0,180,255,0.4);
      color: var(--accent);
    }
    #btn-send:hover { background: linear-gradient(135deg, rgba(0,130,255,0.4), rgba(0,180,255,0.3)); box-shadow: 0 0 20px rgba(0,180,255,0.25); }

    #btn-mic.active {
      border-color: rgba(239,68,68,0.6);
      color: #f87171;
      box-shadow: 0 0 20px rgba(239,68,68,0.25);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 20px rgba(239,68,68,0.25); }
      50%      { box-shadow: 0 0 30px rgba(239,68,68,0.45); }
    }

    #btn-stop {
      border-color: rgba(239,68,68,0.3);
      color: rgba(239,68,68,0.6);
    }
    #btn-stop:hover { border-color: rgba(239,68,68,0.7); color: #f87171; box-shadow: 0 0 14px rgba(239,68,68,0.15); }

    /* ── Footer info ── */
    #footer-info {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--muted); letter-spacing: 1px;
      padding: 0 2px;
    }
    #voice-label { display: flex; align-items: center; gap: 6px; }
    #voice-label::before {
      content: ''; display: block;
      width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 6px #22c55e;
    }

  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ── -->
  <header>
    <div class="logo-ring"><span>J</span></div>
    <div class="header-info">
      <h1>JARVIS</h1>
      <p>Motor de Voz Neural &bull; Álvaro Neural</p>
    </div>
    <div id="status-badge">
      <div id="status-dot"></div>
      <span id="status-text">EN LÍNEA</span>
      <div id="wave-container">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
    </div>
  </header>

  <!-- ── Chat ── -->
  <div id="chat"></div>

  <!-- ── Input ── -->
  <div id="input-area">
    <div id="input-row">
      <button class="btn" id="btn-mic" title="Hablar por micrófono">🎤</button>
      <textarea id="user-input" rows="1" placeholder="Escribe un mensaje o usa el micrófono..."></textarea>
      <button class="btn" id="btn-stop" title="Detener voz">⏹</button>
      <button class="btn" id="btn-send" title="Enviar (Enter)">➤</button>
    </div>
    <div id="footer-info">
      <div id="voice-label">ÁLVARO NEURAL &bull; es-ES-AlvaroNeural</div>
      <div>Enter para enviar &bull; Shift+Enter nueva línea</div>
    </div>
  </div>

</div>

<script>
  const API = 'http://127.0.0.1:5176';
  const chat        = document.getElementById('chat');
  const input       = document.getElementById('user-input');
  const btnSend     = document.getElementById('btn-send');
  const btnMic      = document.getElementById('btn-mic');
  const btnStop     = document.getElementById('btn-stop');
  const statusBadge = document.getElementById('status-badge');
  const statusText  = document.getElementById('status-text');

  let messages  = [];   // historial para Ollama
  let isWorking = false;
  let recognizer = null;
  let micActive  = false;

  // ── Historial inicial de sistema ──────────────────────────────────────────
  messages.push({
    role: 'system',
    content: 'Eres Jarvis, un asistente de inteligencia artificial avanzado. Respondes de forma precisa, concisa y con personalidad. Hablas en español.'
  });

  // ── Utilidades UI ─────────────────────────────────────────────────────────
  function setStatus(state, text) {
    statusBadge.className = state;
    statusText.textContent = text;
  }

  function addMessage(role, text, isTyping = false) {
    const isJarvis = role === 'jarvis';
    const div = document.createElement('div');
    div.className = `msg ${isJarvis ? 'jarvis' : 'user'}`;
    div.innerHTML = `
      <div class="msg-avatar">${isJarvis ? 'J' : 'TÚ'}</div>
      <div class="msg-body">
        <div class="msg-sender">${isJarvis ? 'JARVIS' : 'TÚ'}</div>
        <div class="msg-bubble" id="bubble-${Date.now()}">
          ${isTyping
            ? '<div class="typing-dots"><span></span><span></span><span></span></div>'
            : escapeHtml(text)}
        </div>
      </div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function updateBubble(div, text) {
    const bubble = div.querySelector('.msg-bubble');
    bubble.textContent = text;
  }

  function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── Enviar mensaje ────────────────────────────────────────────────────────
  async function sendMessage(text) {
    text = text.trim();
    if (!text || isWorking) return;

    isWorking = true;
    btnSend.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    messages.push({ role: 'user', content: text });

    setStatus('processing', 'PROCESANDO...');
    const typingDiv = addMessage('jarvis', '', true);

    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, speak: true })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const response = data.response || '(sin respuesta)';

      updateBubble(typingDiv, response);
      messages.push({ role: 'assistant', content: response });
      setStatus('speaking', 'HABLANDO...');

    } catch (err) {
      updateBubble(typingDiv, `⚠️ Error: ${err.message}`);
      setStatus('', 'EN LÍNEA');
      console.error(err);
    } finally {
      isWorking = false;
      btnSend.disabled = false;
    }
  }

  // ── Detener audio ─────────────────────────────────────────────────────────
  async function stopAudio() {
    await fetch(`${API}/api/stop`, { method: 'POST' }).catch(() => {});
    setStatus('', 'EN LÍNEA');
  }

  // ── Micrófono (Web Speech API) ────────────────────────────────────────────
  function initMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { btnMic.title = 'Tu navegador no soporta reconocimiento de voz'; return; }
    recognizer = new SR();
    recognizer.lang = 'es-ES';
    recognizer.continuous = false;
    recognizer.interimResults = false;

    recognizer.onstart  = () => { micActive = true;  btnMic.classList.add('active'); setStatus('listening', 'ESCUCHANDO...'); };
    recognizer.onend    = () => { micActive = false; btnMic.classList.remove('active'); if (!isWorking) setStatus('', 'EN LÍNEA'); };
    recognizer.onerror  = () => { micActive = false; btnMic.classList.remove('active'); };
    recognizer.onresult = e  => {
      const transcript = e.results[0][0].transcript;
      input.value = transcript;
      sendMessage(transcript);
    };
  }
  initMic();

  btnMic.addEventListener('click', () => {
    if (!recognizer) return;
    if (micActive) { recognizer.stop(); return; }
    stopAudio();
    recognizer.start();
  });

  // ── Eventos de input ──────────────────────────────────────────────────────
  btnSend.addEventListener('click', () => sendMessage(input.value));
  btnStop.addEventListener('click', stopAudio);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(input.value);
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ── Polling de estado ─────────────────────────────────────────────────────
  setInterval(async () => {
    try {
      const res  = await fetch(`${API}/api/status`);
      const data = await res.json();
      if (!isWorking) {
        if (data.speaking)    setStatus('speaking',   'HABLANDO...');
        else if (data.processing) setStatus('processing', 'PROCESANDO...');
        else                  setStatus('',            'EN LÍNEA');
      }
    } catch (_) {}
  }, 800);

  // ── Mensaje de bienvenida ─────────────────────────────────────────────────
  addMessage('jarvis', 'Sistemas de voz neural activos. Estoy listo para escucharle, señor. Puede escribir o usar el micrófono.');
</script>
</body>
</html>
